<form>
  <div class="mb-4">
    <label for="name" class="form-label">Name:</label>
    <input type="name" class="form-control" id="name" placeholder="User name">
    <div class="text-danger">
      <small><sup>*</sup>Name is required</small>
    </div>
  </div>

  <div class="mb-4">
    <label for="email" class="form-label">E-mail:</label>
    <input type="email" class="form-control" id="email" placeholder="User e-mail">
    <div class="text-danger">
      <small><sup>*</sup>E-mail is required</small>
    </div>
  </div>

  <div class="row mb-4">
    <div class="col-6">
      <label for="password" class="form-label">Password:</label>
      <input type="password" class="form-control" id="password" placeholder="User password">
      <div class="text-danger">
        <small><sup>*</sup>Password is required</small>
      </div>
    </div>

    <div class="col-6">
      <label for="confirmPassword" class="form-label">Confirm password:</label>
      <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm user password">
      <div class="text-danger">
        <small><sup>*</sup>Password confirmation is required</small>
      </div>
    </div>
  </div>

  <div class="col-12">
    <label class="form-label">User role:</label>
    <div class="d-flex gap-3">
      <div class="form-check">
        <input class="form-check-input" type="radio" name="userRole" id="operator" checked>
        <label class="form-check-label" for="operator">Operator</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="userRole" id="administrator">
        <label class="form-check-label" for="administrator">Administrator</label>
      </div>
    </div>
  </div>

  <div class="text-end">
    <a href="/prototype/pages/users.html" class="btn btn-secondary me-1">Cancel</a>
    <a href="/prototype/pages/users.html" class="btn btn-primary">Save</a>
  </div>
</form>
